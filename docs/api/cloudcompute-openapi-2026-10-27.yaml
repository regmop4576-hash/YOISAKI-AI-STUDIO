                type:
                  type: integer
                  description: ''
                  example: 1
                  enum:
                    - 0
                    - 1
                  nullable: true
                ask_id:
                  type: integer
                  description: 'This field is required when <code>auto_select</code> is not present. This field is required when <code>auto_select</code> is <code>false</code>.'
                  example: 16
                  nullable: true
                auto_select:
                  type: boolean
                  description: ''
                  example: true
                strict_offer:
                  type: boolean
                  description: ''
                  example: false
                max_price_hour_minor:
                  type: integer
                  description: 'This field is required when <code>currency</code> is present. Значение поля value должно быть не меньше 1.'
                  example: 22
                currency:
                  type: string
                  description: 'This field is required when <code>max_price_hour_minor</code> is present. Количество символов в поле value должно быть равным 3.'
                  example: gzm
                expires_at:
                  type: string
                  description: 'Значение поля value не является датой. Значение поля value должно быть датой после <code>now</code>. Значение поля value должно быть датой до или равной <code>2026-10-27T16:21:05+00:00</code>.'
                  example: '2022-11-20'
                offer_filters:
                  type: object
                  description: ''
                  example: null
                  properties:
                    preferred_gpu_name:
                      type: string
                      description: 'This field is required when <code>auto_select</code> is <code>true</code>. Количество символов в поле value не может превышать 128.'
                      example: 'n'
                      nullable: true
                    preferred_num_gpus:
                      type: integer
                      description: 'This field is required when <code>auto_select</code> is <code>true</code>. Значение поля value должно быть не меньше 1.'
                      example: 67
                      nullable: true
                    max_price_rub:
                      type: number
                      description: 'Значение поля value должно быть не меньше 0.'
                      example: 12
                      nullable: true
                  nullable: true
                name:
                  type: string
                  description: 'Количество символов в поле value не может превышать 255.'
                  example: m
                  nullable: true
                stats:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                template_image:
                  type: string
                  description: 'Must match the regex /^$|^([a-z0-9][a-z0-9._\/-]*)(?::[@a-zA-Z0-9][@a-zA-Z0-9._-]*|@sha256:[a-fA-F0-9]{64})?$/u. Количество символов в поле value не может превышать 255.'
