openapi: 3.0.3
info:
  title: 'CloudCompute.ru Compute API'
  description: 'CloudCompute REST API for GPU offers, instances, and SSH keys.'
  version: 1.0.0
servers:
  -
    url: 'https://app.cloudcompute.ru/api/v1'
tags:
  -
    name: 'Compute API'
    description: "\nLaunch managed application GPU instances (e.g. ComfyUI) via API."
  -
    name: Endpoints
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Create a key at <b>/api-access</b> in the dashboard. The raw token is shown once at creation.'
security:
  -
    default: []
paths:
  '/api/v1/applications/{slug}/launch':
    post:
      summary: 'Launch application instance'
      operationId: launchApplicationInstance
      description: "Creates a GPU instance provisioned for the given application slug. Use `auto_select: true`\nto pick the best matching offer from live inventory without supplying `ask_id`."
      parameters: []
      responses: {  }
      tags:
        - 'Compute API'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ask_id:
                  type: integer
                  description: 'optional Exact marketplace offer id. Required unless `auto_select` is true. A taken or ineligible offer returns 422; it is not replaced.'
                  example: 12345
                  nullable: true
                auto_select:
                  type: boolean
                  description: 'optional When true, pick the best offer automatically. This is the only launch mode that may choose a different host.'
                  example: true
                price_hour:
                  type: integer
                  description: 'optional Price ceiling in kopecks for failover.'
                  example: 5000
                  nullable: true
                model_preset_id:
                  type: string
                  description: 'optional Model preset id when the app supports presets.'
                  example: default
                  nullable: true
                ssh_key_ids:
                  type: array
                  description: 'optional SSH key ids to attach. Defaults to all keys for the API key user.'
                  example:
                    - 1
                  items:
                    type: integer
                user_setup_script:
                  type: string
                  description: 'optional Shell script exported as CC_USER_SETUP_B64 on boot (apps with supports_user_script only).'
                  example: architecto
                  nullable: true
                name:
                  type: string
                  description: 'optional Instance display name.'
                  example: architecto
                  nullable: true
                label:
                  type: string
                  description: 'optional Instance label.'
                  example: architecto
                  nullable: true
                disk_gb:
                  type: integer
                  description: 'optional Provisioned disk size in GB.'
                  example: 16
                  nullable: true
                offer_disk_space:
                  type: number
                  description: 'optional Disk capacity in GB from the selected offer. Send this alongside disk_gb when selecting an offer.'
                  example: 4326.41688
                  nullable: true
                offer_filters:
                  type: object
                  description: 'optional Minimum requirements for auto_select (e.g. datacenter, direct_port_count, reliability_min, geolocation).'
                  example: []
                  properties:
                    strict_tier_only:
                      type: boolean
                      description: 'optional When true, do not fall back to relaxed/basic tiers if strict search is empty.'
                      example: false
                      nullable: true
                    no_tier_fallback:
                      type: boolean
                      description: ''
                      example: false
                      nullable: true
                    reliability_min:
                      type: integer
                      description: 'Значение поля value должно быть не меньше 10. Значение поля value не может быть больше 100.'
                      example: 8
                      nullable: true
                    geolocation:
                      type: string
                      description: 'Количество символов в поле value не может превышать 512.'
                      example: v
                      nullable: true
                    disk_space:
                      type: integer
                      description: 'Значение поля value должно быть не меньше 1. Значение поля value не может быть больше 100000.'
                      example: 1
                      nullable: true
                    disk_bw_min:
                      type: integer
                      description: 'Значение поля value должно быть не меньше 0. Значение поля value не может быть больше 50000.'
                      example: 5
                      nullable: true
                    gpu_ram:
                      type: integer
                      description: 'Значение поля value должно быть не меньше 1024. Значение поля value не может быть больше 2000000.'
                      example: 19
                      nullable: true
                    inet_down:
                      type: integer
                      description: 'Значение поля value должно быть не меньше 1. Значение поля value не может быть больше 100000.'
                      example: 17
                      nullable: true
                    inet_up:
                      type: integer
                      description: 'Значение поля value должно быть не меньше 1. Значение поля value не может быть больше 100000.'
                      example: 5
                      nullable: true
                    direct_port_count:
                      type: integer
                      description: 'Значение поля value должно быть не меньше 0. Значение поля value не может быть больше 1000.'
                      example: 8
                      nullable: true
                    cuda_max_good:
                      type: number
                      description: 'Значение поля value должно быть не меньше 1. Значение поля value не может быть больше 30.'
                      example: 14
                      nullable: true
                    datacenter:
                      type: boolean
                      description: ''
                      example: false
                      nullable: true
                    reliable_only:
                      type: boolean
                      description: ''
                      example: false
                      nullable: true
                    free_traffic_only:
                      type: boolean
                      description: ''
                      example: true
                      nullable: true
                    geolocation_in:
                      type: array
                      description: 'Must contain only letters. Количество символов в поле value должно быть равным 2.'
                      example:
                        - wa
                      items:
                        type: string
                  nullable: true
    parameters:
      -
        in: path
        name: slug
        description: 'Application slug (e.g. `comfyui-sdxl`).'
        example: comfyui-sdxl
        required: true
        schema:
          type: string
