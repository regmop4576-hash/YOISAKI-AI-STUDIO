name: Build and publish YOISAKI ENGINE image
# Publishes ghcr.io/<owner>/<repo>/engine:<cloudcompute/VERSION> — a versioned tag, never :latest.
# Runs on a version bump (push touching cloudcompute/VERSION) or manually (Actions → Run workflow).
# A version that is already published is never overwritten: bump cloudcompute/VERSION for a new image.
on:
  workflow_dispatch:
  push:
    paths:
      - cloudcompute/VERSION
permissions:
  contents: read
  packages: write
concurrency:
  group: engine-image
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Version and consistency checks
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < cloudcompute/VERSION)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::cloudcompute/VERSION must be x.y.z"; exit 1; }
          grep -q "org.opencontainers.image.version=\"$version\"" Dockerfile || { echo "::error::Dockerfile label differs from $version"; exit 1; }
          python3 cloudcompute/check_lock.py .
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/engine" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a published version
        id: exists
        shell: bash
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }} already exists; not rebuilt."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space for the ~7 GB CUDA/PyTorch layer
        if: steps.exists.outputs.published == 'false'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune --all --force >/dev/null
          df -h /

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.published == 'false'

      - name: Build and push
        id: build
        if: steps.exists.outputs.published == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          build-args: |
            YOISAKI_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}

      - name: Check anonymous pull access (what CloudCompute needs)
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.meta.outputs.image }}"; repo=${image#ghcr.io/}; tag="${{ steps.meta.outputs.version }}"
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("token",""))' || true)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${repo}/manifests/${tag}")
          {
            echo "### YOISAKI ENGINE image"
            echo "Reference: \`${image}:${tag}\`"
            [[ -n "${{ steps.build.outputs.digest }}" ]] && echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            if [[ $code == 200 ]]; then echo "Anonymous pull: OK (public)."
            else echo "Anonymous pull: HTTP ${code}. Make the package public: GitHub → Your profile → Packages → engine → Package settings → Change visibility → Public."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          [[ $code == 200 ]] || echo "::warning::The image is not publicly pullable yet (HTTP ${code}). CloudCompute cannot pull private images; change the package visibility to Public."
