# Optional: publishes the CloudCompute engine image to GitHub Container Registry so a fresh GPU instance can
# `docker pull` it (YOISAKI_PREBUILT_IMAGE) instead of installing PyTorch (~7 GB) itself.
# The org.yoisaki.source label is computed exactly like start-cloudcompute.sh (source_hash), so the script uses the
# image only for identical engine/cloudcompute files. NOT run during development of 1.7.3 (no Docker there).
name: engine-image
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the CUDA/PyTorch layers
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Source hash (same as start-cloudcompute.sh)
        id: hash
        run: |
          h=$(find Dockerfile engine cloudcompute -type f ! -path '*/__pycache__/*' ! -path 'engine/.venv/*' ! -path 'engine/.results/*' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)
          echo "value=$h" >> "$GITHUB_OUTPUT"
          echo "version=$(cat cloudcompute/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yoisaki-engine:${{ steps.hash.outputs.version }}-cloudcompute
          docker build --label org.yoisaki.source=${{ steps.hash.outputs.value }} -t "$image" .
          docker push "$image"
          echo "YOISAKI_PREBUILT_IMAGE=$image" >> "$GITHUB_STEP_SUMMARY"
